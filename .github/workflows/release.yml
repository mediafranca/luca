# Compila Luca para macOS (binario universal: Apple Silicon e Intel), Windows y Linux y publica los
# instaladores en un release de GitHub. Se dispara al empujar una etiqueta v*
# (p. ej. v0.3.0) o a mano desde la pestaña Actions; en ambos casos el release
# toma su nombre de la versión de src-tauri/tauri.conf.json.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Un solo .dmg universal: nadie tiene que saber qué chip tiene su Mac,
          # y en Apple Silicon corre nativo (sin Rosetta, que Apple retira).
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependencias de Linux (webkit2gtk)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # El hook beforeBuildCommand de Tauri ejecuta `npm run vendor`
      # (empaqueta CodeMirror y copia mermaid/marked).
      - run: npm ci

      - name: Verificar comportamiento y empaquetado
        run: npm test

      - name: Verificar formato Rust
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Verificar compilación nativa
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de macOS. Sin secretos, "-" hace una firma ad-hoc: el bundle
          # pasa a tener _CodeSignature y deja de ser «no usable signature»,
          # aunque Gatekeeper siga pidiendo permiso por no estar notarizada.
          # Si algún día se añaden los secretos de Developer ID, este mismo
          # workflow firma y notariza sin cambiar nada más.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Luca v__VERSION__"
          releaseBody: |
            Instaladores de Luca v__VERSION__. Baja hasta **Assets** y elige el archivo de tu sistema:

            - **macOS** (Apple Silicon e Intel, el mismo archivo): `Luca_…_universal.dmg`
            - **Windows**: `Luca_…_x64-setup.exe`
            - **Linux**: `.AppImage` (cualquier distribución), `.deb` o `.rpm`

            **macOS:** Luca todavía no está notarizada por Apple. Si al abrirla **rebota en el Dock y no abre nunca**, o si macOS dice que «está dañada», no lo está: es la cuarentena de Gatekeeper. Abre Terminal, pega esto y pulsa Intro:

            ```
            xattr -cr /Applications/Luca.app
            ```

            Después abre normal. «Abrir de todos modos» en Ajustes del Sistema **no basta**: autoriza la apertura pero no quita el atributo de cuarentena.

            **Comando `luca` en la terminal:** los paquetes `.deb`, `.rpm` y el `.msi` ya lo dejan instalado. Con el `.dmg`, el AppImage o el `-setup.exe`, actívalo en Preferencias ▸ Generales ▸ Línea de comandos. Más detalles en el README.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Leer versión de la aplicación
        id: app-version
        shell: bash
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').version + '\n')"

      - name: Generar tamaños y SHA-256 de instaladores
        shell: bash
        run: node scripts/artifact-manifest.mjs src-tauri/target "checksums-${{ runner.os }}-${{ runner.arch }}.txt"

      - name: Adjuntar manifiesto verificable al release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.app-version.outputs.version }}" "checksums-${{ runner.os }}-${{ runner.arch }}.txt" --clobber
