# Compila Luca para macOS (binario universal: Apple Silicon e Intel), Windows y Linux y publica los
# instaladores en un release de GitHub. Se dispara al empujar una etiqueta v*
# (p. ej. v0.3.0) o a mano desde la pestaña Actions; en ambos casos el release
# toma su nombre de la versión de src-tauri/tauri.conf.json.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Tag o commit que se empaquetará (vacío: la rama elegida)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Un solo .dmg universal: nadie tiene que saber qué chip tiene su Mac,
          # y en Apple Silicon corre nativo (sin Rosetta, que Apple retira).
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependencias de Linux (webkit2gtk)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # El hook beforeBuildCommand de Tauri ejecuta `npm run vendor`
      # (empaqueta CodeMirror y copia mermaid/marked).
      - run: npm ci

      - name: Verificar comportamiento y empaquetado
        run: npm test

      - name: Verificar formato Rust
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Verificar compilación nativa
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma ad hoc del bundle de macOS. La identidad pública del release
          # se prueba aparte con Sigstore y attestations de GitHub; esto no
          # convierte el bundle en una aplicación reconocida por Gatekeeper.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: v__VERSION__
          releaseName: "Luca v__VERSION__"
          releaseBody: |
            Instaladores de Luca v__VERSION__. Baja hasta **Assets** y elige el archivo de tu sistema:

            - **macOS** (Apple Silicon e Intel, el mismo archivo): `Luca_…_universal.dmg`
            - **Windows**: `Luca_…_x64-setup.exe`
            - **Linux**: `.AppImage` (cualquier distribución), `.deb` o `.rpm`

            **macOS:** Luca todavía no está notarizada por Apple. Si al abrirla **rebota en el Dock y no abre nunca**, o si macOS dice que «está dañada», no lo está: es la cuarentena de Gatekeeper. Abre Terminal, pega esto y pulsa Intro:

            ```
            xattr -cr /Applications/Luca.app
            ```

            Después abre normal. «Abrir de todos modos» en Ajustes del Sistema **no basta**: autoriza la apertura pero no quita el atributo de cuarentena.

            **Verificar procedencia:** cada instalador incluye un archivo del mismo nombre terminado en
            `.sigstore.json`, firmado por este workflow mediante una identidad efímera. Con `cosign`:

            ```sh
            cosign verify-blob ARCHIVO \
              --bundle ARCHIVO.sigstore.json \
              --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            ```

            También puede comprobarse la attestation guardada por GitHub:

            ```sh
            gh attestation verify ARCHIVO --repo mediafranca/luca \
              --signer-workflow mediafranca/luca/.github/workflows/release.yml
            ```

            **Comando `luca` en la terminal:** los paquetes `.deb`, `.rpm` y el `.msi` ya lo dejan instalado. Con el `.dmg`, el AppImage o el `-setup.exe`, actívalo en Preferencias ▸ Generales ▸ Línea de comandos. Más detalles en el README.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Leer versión de la aplicación
        id: app-version
        shell: bash
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').version + '\n')"

      - name: Generar tamaños y SHA-256 de instaladores
        shell: bash
        run: node scripts/artifact-manifest.mjs src-tauri/target "checksums-${{ runner.os }}-${{ runner.arch }}.txt"

      - name: Instalar cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Firmar instaladores con Sigstore
        shell: bash
        run: |
          artifacts=()
          while IFS= read -r -d '' artifact; do
            artifacts+=("$artifact")
          done < <(find src-tauri/target -type f -path '*/bundle/*' \( \
            -iname '*.dmg' -o -iname '*.exe' -o -iname '*.msi' -o \
            -iname '*.AppImage' -o -iname '*.deb' -o -iname '*.rpm' \
          \) -print0)
          test "${#artifacts[@]}" -gt 0
          for artifact in "${artifacts[@]}"; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done

      - name: Registrar procedencia verificable en GitHub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm

      - name: Adjuntar manifiesto y firmas al release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundles=()
          while IFS= read -r -d '' bundle; do
            bundles+=("$bundle")
          done < <(find src-tauri/target -type f -name '*.sigstore.json' -path '*/bundle/*' -print0)
          test "${#bundles[@]}" -gt 0
          gh release upload "v${{ steps.app-version.outputs.version }}" \
            "checksums-${{ runner.os }}-${{ runner.arch }}.txt" "${bundles[@]}" --clobber

  # El borrador solo deja de serlo si los tres sistemas compilaron y firmaron:
  # un build roto no publica un release a medias.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v$(node -p "require('./package.json').version")" --draft=false --latest
