<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>luca</title>
<style>
  :root { color-scheme: light dark; --gap: 1px; --rule: rgba(127,127,127,.25); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-columns: 1fr 1fr; background: var(--rule);
         font: 15px/1.6 -apple-system, system-ui, sans-serif; }
  #editor, #preview { height: 100vh; overflow: auto; background: Canvas; }
  #editor { border: 0; outline: 0; resize: none; padding: 20px 24px;
            font: 14px/1.6 ui-monospace, Menlo, monospace; color: CanvasText; }
  #preview { padding: 20px 28px; }
  pre, code { font-family: ui-monospace, Menlo, monospace; }
  #preview pre:not(.mermaid) { background: rgba(127,127,127,.12); padding: 12px; border-radius: 8px; overflow-x: auto; }
  pre.mermaid { background: transparent; text-align: center; }
  img { max-width: 100%; }
  blockquote { border-left: 3px solid var(--rule); margin: 0; padding-left: 1em; opacity: .85; }
  table { border-collapse: collapse; } td, th { border: 1px solid var(--rule); padding: 4px 8px; }
  @media (max-width: 640px) { body { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } #editor, #preview { height: 50vh; } }
</style>
</head>
<body>
  <textarea id="editor" spellcheck="false"></textarea>
  <div id="preview"></div>
  <!-- ponytail: marked + mermaid from CDN — needs network. Vendor the two .js
       files into ui/ when offline rendering matters. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
