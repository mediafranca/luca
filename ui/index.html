<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>luca</title>
<style>
  :root { color-scheme: light dark; --rule: rgba(127,127,127,.25); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh;
         font: 15px/1.6 -apple-system, system-ui, sans-serif; background: Canvas; }

  /* Barra de pestañas */
  #tabs { display: flex; align-items: stretch; gap: 1px; overflow-x: auto;
          background: var(--rule); border-bottom: 1px solid var(--rule); }
  .tab { display: flex; align-items: center; gap: 6px; padding: 6px 10px;
         background: Canvas; cursor: default; white-space: nowrap; font-size: 13px;
         max-width: 240px; opacity: .6; }
  .tab.active { opacity: 1; }
  .tab .label { overflow: hidden; text-overflow: ellipsis; }
  .tab .close { border: 0; background: transparent; color: inherit; cursor: pointer;
                font-size: 15px; line-height: 1; padding: 0 2px; opacity: .5; }
  .tab .close:hover { opacity: 1; }

  /* Barra de modos */
  #modebar { display: flex; align-items: center; gap: 6px; padding: 5px 10px;
             border-bottom: 1px solid var(--rule); font-size: 12px; }
  #modebar button { border: 1px solid var(--rule); background: Canvas; color: inherit;
                    padding: 3px 11px; border-radius: 6px; cursor: pointer; opacity: .55; }
  #modebar button.active { opacity: 1; font-weight: 600; }
  #modebar .spacer { flex: 1; }

  /* Área de trabajo: editor | preview */
  #workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
               background: var(--rule); min-height: 0; }
  body[data-mode="source"]   #previews { display: none; }
  body[data-mode="source"]   #workspace { grid-template-columns: 1fr; }
  body[data-mode="rendered"] #editors  { display: none; }
  body[data-mode="rendered"] #workspace { grid-template-columns: 1fr; }
  body[data-zen="on"] #tabs, body[data-zen="on"] #modebar { display: none; }
  #editors, #previews { position: relative; min-height: 0; background: Canvas; overflow: hidden; }
  .doc-editor { height: 100%; }
  .doc-editor[hidden], .doc-preview[hidden] { display: none; }
  .doc-preview { height: 100%; overflow: auto; padding: 20px 28px; }
  .cm-editor { height: 100%; }
  .cm-editor.cm-focused { outline: none; }

  /* Preview */
  pre, code { font-family: ui-monospace, Menlo, monospace; }
  .doc-preview pre:not(.mermaid) { background: rgba(127,127,127,.12); padding: 12px; border-radius: 8px; overflow-x: auto; }
  pre.mermaid { background: transparent; text-align: center; }
  pre.mermaid-error { background: rgba(220,60,60,.12); color: #c0392b; padding: 10px 12px;
                      border-radius: 8px; white-space: pre-wrap; font-size: 13px; }
  img { max-width: 100%; }
  blockquote { border-left: 3px solid var(--rule); margin: 0; padding-left: 1em; opacity: .85; }
  table { border-collapse: collapse; } td, th { border: 1px solid var(--rule); padding: 4px 8px; }
  @media (max-width: 640px) { #workspace { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
  <div id="tabs"></div>
  <div id="modebar">
    <button data-mode="source">source</button>
    <button data-mode="split">split</button>
    <button data-mode="rendered">rendered</button>
    <span class="spacer"></span>
    <button id="zen" title="Modo zen (oculta las barras) · ⌘⇧Z">zen</button>
  </div>
  <div id="workspace">
    <div id="editors"></div>
    <div id="previews"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
