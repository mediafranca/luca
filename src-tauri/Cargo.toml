[package]
name = "luca"
version = "0.6.0"
edition = "2021"
description = "Editor Markdown mínimo y rápido"
authors = ["Herbert Spencer González"]
homepage = "https://github.com/mediafranca/luca"
repository = "https://github.com/mediafranca/luca"
license = "EUPL-1.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Impresión nativa con márgenes en macOS (Tauri imprime con márgenes cero).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
